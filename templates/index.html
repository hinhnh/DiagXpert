<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>DiagXpert - Automotive Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            margin-top: 30px;
            color: #333;
        }
        #chat-box {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 600px;
            padding: 20px;
            margin-top: 20px;
        }
        textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }
        button {
            padding: 10px 15px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 5px;
        }
        button:hover {
            background: #1d4ed8;
        }
        #answer {
            margin-top: 20px;
            padding: 15px;
            background: #f9fafb;
            border-radius: 6px;
            min-height: 50px;
            border: 1px solid #e5e7eb;
        }
        audio {
            margin-top: 15px;
            width: 100%;
        }
        .recording-btn {
            background: #dc2626;
        }
        .recording-btn:hover {
            background: #b91c1c;
        }
        .button-container {
            display: flex;
            margin-bottom: 10px;
        }
        #recording-status {
            margin-left: 10px;
            color: #666;
            font-style: italic;
        }
        .pulse {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #dc2626;
            animation: pulse 1.5s infinite;
            margin-right: 8px;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <h1>DiagXpert Chatbot</h1>

    <div id="chat-box">
        <div class="button-container">
            <button id="record-button">Bắt đầu ghi âm</button>
            <span id="recording-status"></span>
        </div>
        
        <textarea id="question" placeholder="Nhập câu hỏi về lỗi ô tô..."></textarea>
        <button onclick="sendQuestion()">Gửi câu hỏi</button>

        <div id="answer"></div>
        <audio id="audio-player" controls hidden></audio>
    </div>

    <script>
        const recordButton = document.getElementById('record-button');
        const recordingStatus = document.getElementById('recording-status');
        const questionInput = document.getElementById('question');
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        // Bắt đầu hoặc dừng ghi âm
        recordButton.addEventListener('click', async () => {
            if (isRecording) {
                stopRecording();
            } else {
                await startRecording();
            }
        });

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };
                
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    await transcribeAudio(audioBlob);
                };
                
                mediaRecorder.start();
                isRecording = true;
                recordButton.textContent = 'Dừng ghi âm';
                recordButton.classList.add('recording-btn');
                recordingStatus.innerHTML = '<span class="pulse"></span>Đang ghi âm...';
            } catch (error) {
                console.error('Lỗi khi truy cập microphone:', error);
                recordingStatus.textContent = 'Lỗi: Không thể truy cập microphone';
            }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                recordButton.textContent = 'Bắt đầu ghi âm';
                recordButton.classList.remove('recording-btn');
                recordingStatus.textContent = '';
            }
        }

        async function transcribeAudio(audioBlob) {
            recordingStatus.textContent = 'Đang chuyển đổi...';
            
            const formData = new FormData();
            formData.append('audio', audioBlob, 'recording.webm');
            
            try {
                const response = await fetch('/transcribe', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                if (result.text) {
                    questionInput.value = result.text;
                    recordingStatus.textContent = 'Đã chuyển đổi thành văn bản!';
                } else {
                    recordingStatus.textContent = 'Lỗi: Không chuyển đổi được văn bản';
                }
            } catch (error) {
                console.error('Lỗi khi gửi âm thanh:', error);
                recordingStatus.textContent = 'Lỗi kết nối đến server';
            }
        }

        async function sendQuestion() {
            const question = questionInput.value.trim();
            const answerBox = document.getElementById("answer");
            const audioPlayer = document.getElementById("audio-player");

            if (!question) {
                alert("⚠️ Vui lòng nhập câu hỏi!");
                return;
            }

            answerBox.innerHTML = "⏳ Đang xử lý...";
            audioPlayer.hidden = true;
            audioPlayer.src = "";

            try {
                const res = await fetch("/ask", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question })
                });

                const data = await res.json();

                if (res.ok) {
                    answerBox.innerHTML = data.answer || "(Không có câu trả lời)";

                    if (data.audio_url) {
                        audioPlayer.src = data.audio_url;
                        audioPlayer.hidden = false;
                        audioPlayer.play().catch(err => console.warn("Không tự động phát audio:", err));
                    }
                } else {
                    answerBox.innerHTML = "❌ Lỗi: " + (data.answer || "Không xác định");
                }
            } catch (err) {
                console.error(err);
                answerBox.innerHTML = "❌ Lỗi kết nối đến server.";
            }
        }
    </script>

</body>
</html>
